name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install formatting tools
        run: |
          pip install black isort autoflake

      - name: Check code formatting (black)
        run: |
          black --check --diff --line-length 120 .

      - name: Check import sorting (isort)
        run: |
          isort --check --diff --profile black --line-length 120 .

      - name: Check for unused imports/variables (autoflake)
        run: |
          autoflake --check --recursive --remove-all-unused-imports --remove-unused-variables --ignore-init-module-imports .

      - name: Run pylint
        run: |
          pip install pylint
          pylint --rcfile=pylint.rc core/ functions/ libs/ database/ bot.py || true